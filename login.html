<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgendAi - Acessar Conta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-light: #F8FAFC;
      --text-dark: #0F172A;
      --text-gray: #475569;
      --primary: #4F46E5;
      --action: #10B981;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background-color: var(--bg-light);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* TOPO COM LOGO */
    .header-logo {
      margin-bottom: 30px;
      text-decoration: none;
      font-size: 28px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -1px;
    }

    /* CARD CONTAINER */
    .auth-card {
      background: #FFFFFF;
      width: 100%;
      max-width: 420px;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.05);
    }

    /* NAVEGAÇÃO POR ABAS */
    .tabs {
      display: flex;
      background: #F1F5F9;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-gray);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: #FFFFFF;
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    /* FORMULÁRIOS */
    .form-container { display: none; }
    .form-container.active { display: block; }

    .form-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .form-subtitle {
      font-size: 13px;
      color: var(--text-gray);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #CBD5E1;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }
    .form-group input:focus {
      border-color: var(--primary);
    }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: #FFFFFF;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    .btn-submit.action-btn {
      background: var(--action);
    }
    .btn-submit:hover {
      opacity: 0.95;
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .msg-box {
      display: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
    }
    .msg-box.error {
      background: #FEE2E2;
      color: #991B1B;
      display: block;
    }
    .msg-box.success {
      background: #D1FAE5;
      color: #065F46;
      display: block;
    }
  </style>
</head>
<body>

  <!-- VOLTAR / LOGO -->
  <a href="index.html" class="header-logo">AgendAi.</a>

  <!-- CARD PRINCIPAL -->
  <div class="auth-card">
    
    <!-- ABAS -->
    <div class="tabs">
      <button type="button" class="tab-btn active" id="tabLogin" onclick="window.alternarAba('login')">Entrar</button>
      <button type="button" class="tab-btn" id="tabCadastro" onclick="window.alternarAba('cadastro')">Criar Conta</button>
    </div>

    <!-- MENSAGENS DE ALERTA -->
    <div id="msgAlerta" class="msg-box"></div>

    <!-- FORMULÁRIO DE LOGIN -->
    <div id="formLogin" class="form-container active">
      <div class="form-title">Bem-vindo de volta!</div>
      <div class="form-subtitle">Digite seus dados para acessar o seu painel.</div>
      
      <form onsubmit="window.handleLogin(event)">
        <div class="form-group">
          <label for="loginEmail">E-mail</label>
          <input type="email" id="loginEmail" placeholder="seu@email.com" required>
        </div>
        <div class="form-group">
          <label for="loginSenha">Senha</label>
          <input type="password" id="loginSenha" placeholder="Sua senha" required>
        </div>
        <button type="submit" id="btnLoginSubmit" class="btn-submit">Entrar no Sistema</button>
      </form>
    </div>

    <!-- FORMULÁRIO DE CADASTRO (30 DIAS GRÁTIS) -->
    <div id="formCadastro" class="form-container">
      <div class="form-title">Comece seus 30 Dias Grátis</div>
      <div class="form-subtitle">Crie sua conta em menos de 1 minuto. Sem cartão.</div>
      
      <form onsubmit="window.handleCadastro(event)">
        <div class="form-group">
          <label for="cadEmail">Seu melhor e-mail</label>
          <input type="email" id="cadEmail" placeholder="seu@email.com" required>
        </div>
        <div class="form-group">
          <label for="cadSenha">Crie uma senha</label>
          <input type="password" id="cadSenha" placeholder="Mínimo 6 caracteres" minlength="6" required>
        </div>
        <button type="submit" id="btnCadastrarSubmit" class="btn-submit action-btn">Criar Conta Grátis</button>
      </form>
    </div>

  </div>

  <!-- SDK OFICIAL DO SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // 1. FUNÇÕES VISUAIS GLOBAIS
    window.alternarAba = function(modo) {
      window.exibirMensagem('', ''); // Limpa alertas anteriores

      const tabLogin = document.getElementById('tabLogin');
      const tabCadastro = document.getElementById('tabCadastro');
      const formLogin = document.getElementById('formLogin');
      const formCadastro = document.getElementById('formCadastro');

      if (modo === 'cadastro') {
        if (tabLogin) tabLogin.classList.remove('active');
        if (tabCadastro) tabCadastro.classList.add('active');
        if (formLogin) formLogin.classList.remove('active');
        if (formCadastro) formCadastro.classList.add('active');
      } else {
        if (tabCadastro) tabCadastro.classList.remove('active');
        if (tabLogin) tabLogin.classList.add('active');
        if (formCadastro) formCadastro.classList.remove('active');
        if (formLogin) formLogin.classList.add('active');
      }
    };

    window.exibirMensagem = function(texto, tipo) {
      const msgBox = document.getElementById('msgAlerta');
      if (!msgBox) return;

      if (!texto) {
        msgBox.className = 'msg-box';
        msgBox.innerText = '';
        return;
      }
      msgBox.className = `msg-box ${tipo}`;
      msgBox.innerText = texto;
    };

    // Identifica o modo pela URL ao carregar a página (?modo=cadastro)
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('modo') === 'cadastro') {
        window.alternarAba('cadastro');
      }
    });

    // 2. CONFIGURAÇÃO DO SUPABASE
    const SUPABASE_URL = 'https://yhecaaajbgetcnfdcqxj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InloZWNhYWFqYmdldGNuZmRjcXhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MzE1ODAsImV4cCI6MjEwMDQwNzU4MH0.vKQchgJqiak8koqi56Cik1WIuTIlYkoKdPaH3xAUZzs';
    
    let supabase;
    if (window.supabase) {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    // 3. PROCESSAR LOGIN
    window.handleLogin = async function(event) {
      event.preventDefault();
      window.exibirMensagem('', '');

      if (!supabase) return window.exibirMensagem('Erro de conexão. Atualize a página.', 'error');

      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginSenha').value;
      const btn = document.getElementById('btnLoginSubmit');

      try {
        btn.disabled = true;
        btn.innerText = 'Entrando...';

        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;

        window.exibirMensagem('Login realizado com sucesso! Redirecionando...', 'success');
        setTimeout(() => { window.location.href = 'home.html'; }, 1000);

      } catch (error) {
        window.exibirMensagem(error.message === 'Invalid login credentials' ? 'E-mail ou senha incorretos.' : 'Erro: ' + error.message, 'error');
        btn.disabled = false;
        btn.innerText = 'Entrar no Sistema';
      }
    };

    // 4. PROCESSAR CADASTRO
    window.handleCadastro = async function(event) {
      event.preventDefault();
      window.exibirMensagem('', '');

      if (!supabase) return window.exibirMensagem('Erro de conexão. Atualize a página.', 'error');

      const email = document.getElementById('cadEmail').value;
      const password = document.getElementById('cadSenha').value;
      const btn = document.getElementById('btnCadastrarSubmit');

      try {
        btn.disabled = true;
        btn.innerText = 'Criando sua conta...';

        const { data: authData, error: authError } = await supabase.auth.signUp({ email, password });
        if (authError) throw authError;

        const user = authData.user;
        if (user) {
          const { error: userTableError } = await supabase.from('usuarios').insert([{ id: user.id, email: user.email, perfil: 'assinante' }]);
          if (userTableError) throw userTableError;

          const { error: assinanteError } = await supabase.from('assinantes').insert([{
            usuario_id: user.id, nome: 'Novo Assinante', email_contato: user.email, plano: 'basico', status_assinatura: 'degustacao'
          }]);
          if (assinanteError) throw assinanteError;

          window.exibirMensagem('Conta criada com sucesso!', 'success');
          setTimeout(() => { window.location.href = 'home.html?onboarding=true'; }, 1000);
        }
      } catch (error) {
        window.exibirMensagem('Erro ao criar conta: ' + error.message, 'error');
        btn.disabled = false;
        btn.innerText = 'Criar Conta Grátis';
      }
    };
  </script>
</body>
</html>
